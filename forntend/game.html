<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pykinator, the mind reading snake</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
    <header></header>

    <main class="game-main">
        <div class="game-container">
            <div class="game-character">
                <img src="assets/pykinator.png" alt="Pykinator, your guessing guide">
            </div>
            <section class="game-content" aria-labelledby="game-question">
                <div class="question-card">
                    <span class="question-number" aria-label="Question 1">1</span>
                    <h1 id="game-question">Is your character male?</h1>
                </div>
                <div class="answers" role="group" aria-label="Choose your answer">
                    <button type="button">Yes</button>
                    <button type="button">No</button>
                    <button type="button">Don't Know</button>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="foterconatiner">
            <div class="footer-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="https://github.com/sanjib-nath/Pykinator/blob/main/README.md" target="_blank" rel="noopener noreferrer">How it works</a></li>
                    <li><a href="https://github.com/sanjib-nath" target="_blank" rel="noopener noreferrer">Github</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>Developed by Sanjib</p>
        </div>
    </footer>
</body>
</html>
